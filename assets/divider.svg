<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line { stroke: #262E3C; stroke-width: 1; }
    .dot  { fill: #C6F135; }
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
  </style>
  <line class="line" x1="0" y1="10" x2="1200" y2="10"/>
  <circle class="dot" cy="10" r="3" cx="0">
    <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
