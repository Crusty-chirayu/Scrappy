<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Scrappy</title>
  <desc id="d">Animated banner. Three data traces converge into one glowing node beside the wordmark scrappy and the line Every price. One truth.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C6F135" fill-opacity="0.08"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C6F135" stop-opacity=".30"/>
      <stop offset="1" stop-color="#C6F135" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .word { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 96px; letter-spacing: -3px; fill: #F3F1EC; }
    .tag  { font-size: 20px; letter-spacing: 3px; fill: #C6F135; }
    .sub  { font-size: 14px; letter-spacing: 1px; fill: #98A2B3; }
    .eyebrow { font-size: 12px; letter-spacing: 3px; fill: #5B677C; }
    .axis { font-size: 11px; letter-spacing: 1px; fill: #5B677C; }

    .tr { fill: none; stroke: #5B677C; stroke-width: 2; stroke-linecap: round;
          stroke-dasharray: 400; stroke-dashoffset: 400;
          animation: draw 1.8s cubic-bezier(.2,0,0,1) forwards; }
    .tr.b { animation-delay: .15s; }
    .tr.c { animation-delay: .30s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .pl { fill: none; stroke: #C6F135; stroke-width: 3; stroke-linecap: round;
          stroke-dasharray: 30 370; stroke-dashoffset: 30; opacity: 0;
          animation: run 3.4s linear 2s infinite; }
    .pl.b { animation-delay: 2.4s; }
    .pl.c { animation-delay: 2.8s; }
    @keyframes run { 0% { opacity: 1; stroke-dashoffset: 30; } 90% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: -400; } }

    .halo { fill: url(#glow); opacity: 0; animation: fade .8s ease-out 1.6s forwards, breathe 3.2s ease-in-out 2.4s infinite; transform-box: fill-box; transform-origin: center; }
    .nd   { fill: #C6F135; opacity: 0; animation: fade .5s ease-out 1.6s forwards; }
    .ring { fill: none; stroke: #C6F135; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 3.4s ease-out 2s infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }

    .fx { opacity: 0; animation: up .9s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: 1.9s; } .d2 { animation-delay: 2.1s; } .d3 { animation-delay: 2.3s; } .d4 { animation-delay: 2.5s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .step { fill: none; stroke: #C6F135; stroke-width: 2; stroke-linejoin: round;
            stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2.6s cubic-bezier(.2,0,0,1) 2.2s forwards; }
    .tip { fill: #C6F135; opacity: 0; animation: fade .3s ease-out 4.8s forwards, blink 1.6s ease-in-out 5s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .axisln { stroke: #262E3C; stroke-width: 1; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .tr, .step { stroke-dashoffset: 0; }
      .pl, .ring { opacity: 0; }
      .halo, .nd, .fx, .tip { opacity: 1; }
    }
  </style>

  <rect width="1200" height="320" fill="#0A0C0F"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="319" fill="none" stroke="#262E3C"/>

  <text x="40" y="44" class="eyebrow">PRECISION DATA INSTRUMENT</text>

  <!-- three sources converge into one trusted node -->
  <path class="tr"   pathLength="400" d="M40 100 C 160 100, 220 160, 330 160"/>
  <path class="tr b" pathLength="400" d="M40 160 L 330 160"/>
  <path class="tr c" pathLength="400" d="M40 220 C 160 220, 220 160, 330 160"/>
  <path class="pl"   pathLength="400" d="M40 100 C 160 100, 220 160, 330 160"/>
  <path class="pl b" pathLength="400" d="M40 160 L 330 160"/>
  <path class="pl c" pathLength="400" d="M40 220 C 160 220, 220 160, 330 160"/>
  <circle class="halo" cx="330" cy="160" r="60"/>
  <circle class="ring" cx="330" cy="160" r="9"/>
  <circle class="nd"   cx="330" cy="160" r="9"/>

  <!-- wordmark -->
  <text class="word fx d1" x="388" y="182">scrappy</text>
  <text class="tag fx d2" x="392" y="226">EVERY PRICE. ONE TRUTH.</text>
  <text class="sub fx d3" x="392" y="256">compare  ·  intelligence  ·  extract</text>

  <!-- step-line price history (prices are discrete events, not curves) -->
  <g class="fx d4">
    <text x="850" y="86" class="axis">PRICE HISTORY · STEP LINE</text>
    <line class="axisln" x1="850" y1="96" x2="1160" y2="96"/>
    <line class="axisln" x1="850" y1="250" x2="1160" y2="250"/>
  </g>
  <path class="step" pathLength="400" d="M850 130 H905 V160 H950 V148 H1005 V196 H1060 V182 H1105 V226 H1160"/>
  <circle class="tip" cx="1160" cy="226" r="5"/>
</svg>
