<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Scrappy data pipeline</title>
  <desc id="d">A data packet travels through six stages: source, extract, normalize, match, price graph, and intelligence. Each stage lights up as the packet passes.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lb { font-size: 12px; letter-spacing: 2px; fill: #98A2B3; text-anchor: middle; }
    .sb { font-size: 11px; fill: #5B677C; text-anchor: middle; }
    .rail { stroke: #262E3C; stroke-width: 2; }
    .st { fill: #0F1217; stroke: #5B677C; stroke-width: 2; animation: lit 7s ease-out infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.4s; } .s3 { animation-delay: 2.8s; }
    .s4 { animation-delay: 4.2s; } .s5 { animation-delay: 5.6s; } .s6 { animation-delay: 7s; }
    @keyframes lit {
      0%   { fill: #C6F135; stroke: #C6F135; }
      12%  { fill: #0F1217; stroke: #C6F135; }
      30%  { fill: #0F1217; stroke: #5B677C; }
      100% { fill: #0F1217; stroke: #5B677C; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } animateMotion { display: none; } }
  </style>
  <rect width="1200" height="170" fill="#0A0C0F"/>
  <rect x=".5" y=".5" width="1199" height="169" fill="none" stroke="#262E3C"/>

  <line class="rail" x1="100" y1="64" x2="1100" y2="64"/>

  <circle class="st s1" cx="100"  cy="64" r="14"/>
  <circle class="st s2" cx="300"  cy="64" r="14"/>
  <circle class="st s3" cx="500"  cy="64" r="14"/>
  <circle class="st s4" cx="700"  cy="64" r="14"/>
  <circle class="st s5" cx="900"  cy="64" r="14"/>
  <circle class="st s6" cx="1100" cy="64" r="14"/>

  <text class="lb" x="100"  y="110">SOURCE</text>
  <text class="lb" x="300"  y="110">EXTRACT</text>
  <text class="lb" x="500"  y="110">NORMALIZE</text>
  <text class="lb" x="700"  y="110">MATCH</text>
  <text class="lb" x="900"  y="110">PRICE GRAPH</text>
  <text class="lb" x="1100" y="110">INTELLIGENCE</text>

  <text class="sb" x="100"  y="130">robots-aware fetch</text>
  <text class="sb" x="300"  y="130">adapters + fixtures</text>
  <text class="sb" x="500"  y="130">paise · units · packs</text>
  <text class="sb" x="700"  y="130">evidence, never guesses</text>
  <text class="sb" x="900"  y="130">immutable history</text>
  <text class="sb" x="1100" y="130">alerts · reports · API</text>

  <circle r="6" fill="#C6F135">
    <animateMotion dur="7s" repeatCount="indefinite" path="M100 64 H1100"/>
  </circle>
  <circle r="12" fill="#C6F135" fill-opacity=".25">
    <animateMotion dur="7s" repeatCount="indefinite" path="M100 64 H1100"/>
  </circle>
</svg>
