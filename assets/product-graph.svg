<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">The Scrappy product graph</title>
  <desc id="d">One canonical product connected to retailer listings. Solid lime lines are matched with high confidence, a dashed violet line is a possible match held for review, and a red dashed line is a rejected listing because of a hard storage conflict.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C6F135" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #D6DBE3; }
    .h  { font-size: 13px; font-weight: 700; fill: #F3F1EC; }
    .s  { font-size: 11px; fill: #98A2B3; }
    .ok { font-size: 11px; fill: #C6F135; }
    .pm { font-size: 11px; fill: #9A7BFF; }
    .no { font-size: 11px; fill: #F2685B; }
    .box { fill: #141922; stroke: #262E3C; stroke-width: 1; }
    .core { fill: #0F1217; stroke: #C6F135; stroke-width: 1.5; }

    .m  { stroke: #C6F135; stroke-width: 2; fill: none; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s cubic-bezier(.2,0,0,1) forwards; }
    .m2 { animation-delay: .25s; }
    .flow { stroke: #C6F135; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 24 376; opacity: 0; animation: run 3s linear 1.6s infinite; }
    .flow2 { animation-delay: 2.2s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes run { 0% { opacity: 1; stroke-dashoffset: 24; } 92% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: -400; } }

    .p  { stroke: #9A7BFF; stroke-width: 2; fill: none; stroke-dasharray: 7 7; opacity: 0; animation: fade .6s ease-out .7s forwards, march 1.2s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -28; } }
    .r  { stroke: #F2685B; stroke-width: 2; fill: none; stroke-dasharray: 3 8; opacity: 0; animation: fade .6s ease-out 1s forwards; }
    @keyframes fade { to { opacity: 1; } }

    .nd { opacity: 0; animation: pop .6s cubic-bezier(.16,1,.3,1) forwards; transform-box: fill-box; transform-origin: center; }
    .n1 { animation-delay: .1s; } .n2 { animation-delay: .3s; } .n3 { animation-delay: .5s; } .n4 { animation-delay: .7s; }
    @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
    .beat { fill: none; stroke: #C6F135; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: beat 3.2s ease-out infinite; }
    @keyframes beat { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .m { stroke-dashoffset: 0; }
      .p, .r, .nd { opacity: 1; }
      .flow, .beat { opacity: 0; }
    }
  </style>

  <rect width="900" height="450" fill="#0A0C0F"/>
  <rect width="900" height="450" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="899" height="449" fill="none" stroke="#262E3C"/>

  <!-- edges (drawn first, under nodes) -->
  <path class="m"       pathLength="400" d="M235 108 L 360 200"/>
  <path class="m m2"    pathLength="400" d="M665 108 L 540 200"/>
  <path class="flow"    pathLength="400" d="M235 108 L 360 200"/>
  <path class="flow flow2" pathLength="400" d="M665 108 L 540 200"/>
  <path class="p"       d="M235 342 L 360 250"/>
  <path class="r"       d="M665 342 L 540 250"/>

  <!-- edge labels -->
  <text x="205" y="168" class="ok" text-anchor="middle">0.99 · GTIN match</text>
  <text x="695" y="168" class="ok" text-anchor="middle">0.97 · model + spec</text>
  <text x="205" y="300" class="pm" text-anchor="middle">0.82 · possible match</text>
  <text x="695" y="300" class="no" text-anchor="middle">✕ hard conflict</text>

  <!-- canonical product -->
  <g class="nd n1">
    <rect class="core" x="330" y="196" width="240" height="58" rx="4"/>
    <rect class="beat" x="330" y="196" width="240" height="58" rx="4"/>
    <text x="450" y="221" class="h" text-anchor="middle">Phone X · 128GB · Black</text>
    <text x="450" y="239" class="s" text-anchor="middle">CANONICAL PRODUCT</text>
  </g>

  <!-- listings -->
  <g class="nd n2">
    <rect class="box" x="60" y="62" width="190" height="56" rx="4"/>
    <text x="76" y="86" class="h">Retailer A</text>
    <text x="76" y="104" class="s">₹ 74,999 · in stock</text>
  </g>
  <g class="nd n3">
    <rect class="box" x="650" y="62" width="190" height="56" rx="4"/>
    <text x="666" y="86" class="h">Retailer B</text>
    <text x="666" y="104" class="s">₹ 75,490 · in stock</text>
  </g>
  <g class="nd n4">
    <rect class="box" x="60" y="332" width="190" height="56" rx="4"/>
    <text x="76" y="356" class="h">Retailer C</text>
    <text x="76" y="374" class="s">title only · held for review</text>
  </g>
  <g class="nd n4">
    <rect class="box" x="650" y="332" width="190" height="56" rx="4"/>
    <text x="666" y="356" class="h">Retailer D</text>
    <text x="666" y="374" class="s">256GB variant · rejected</text>
  </g>

  <!-- legend -->
  <g transform="translate(60 424)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#C6F135" stroke-width="2"/>
    <text x="34" y="4" class="s">Matched</text>
    <line x1="120" y1="0" x2="146" y2="0" stroke="#9A7BFF" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="154" y="4" class="s">Possible match (excluded from price math)</text>
    <line x1="430" y1="0" x2="456" y2="0" stroke="#F2685B" stroke-width="2" stroke-dasharray="3 6"/>
    <text x="464" y="4" class="s">Rejected: hard conflict</text>
    <text x="780" y="4" class="s" text-anchor="end">illustrative data</text>
  </g>
</svg>
