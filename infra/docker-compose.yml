services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scrappy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: scrappy
      POSTGRES_PASSWORD: scrappy_dev
      POSTGRES_DB: scrappy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrappy -d scrappy"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: scrappy-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:latest
    container_name: scrappy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: scrappy_admin
      MINIO_ROOT_PASSWORD: scrappy_password_123
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
